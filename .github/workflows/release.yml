name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without v; leave empty for rehearsal
        required: false
        type: string

# Every job declares timeout-minutes so a hung step fails in minutes
# rather than inheriting the 360-minute GitHub default.

jobs:
  npm-credential:
    name: The npm credential can publish this package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # GATE, and a separate job on purpose. The first irreversible act in this
      # workflow is `npm publish` itself, so the publish job has to depend on a
      # job it cannot reach past. Written as a step inside the publish job it
      # would be skippable while the job still reported green, which is the
      # shape that shipped a vulnerable carve-py in this organization.
      #
      # WHY IT EXISTS. carve-grammars v0.1.13, 2026-10-08: every gate passed,
      # the release was approved, the tag was created, Packagist served it
      # within two minutes, and then `npm publish` answered
      # "404 Not Found - PUT" on the package URL. npm answers 404 rather than
      # 403 for a scoped package so it does not leak existence, so that is an
      # authorization failure and not a missing package: 0.1.11 was serving at
      # the time. The result was a version on Packagist that npm did not have.
      # A credential is checkable without publishing anything, and it was the
      # one precondition no gate checked.
      #
      # Nothing below publishes, changes or deprecates anything.
      - name: The token is live and can write this package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not readable from this repository, so the publish cannot authenticate at all."
            exit 1
          fi

          # FATAL. An expired, revoked or malformed token fails here with
          # 401 / ENEEDAUTH, and this is the one probe below whose failure is
          # unambiguous.
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm rejected the credential: ${who}"
            echo "::error::rotate NPM_TOKEN before releasing. A 404 on PUT is an auth failure, not a missing package."
            exit 1
          fi
          echo "authenticated as ${who}"

          pkg="$(node -p "require('./package.json').name")"
          echo "package under release: ${pkg}"

          # REPORTED, NOT FATAL, and measured rather than assumed. This is the
          # organization endpoint /-/org/<scope>/package, an org read and not a
          # package write. On carve-wasm run 32156381782 this organization's
          # NPM_TOKEN answered 403 "You may not perform that action with these
          # credentials" here, while an anonymous GET of the same URL returned
          # the whole scope. A credential with fewer rights than a stranger on
          # an org endpoint is the signature of a granular access token, which
          # says nothing about whether it can publish. Made fatal, as the first
          # draft of this gate had it, this would refuse every release in this
          # organization.
          echo "== packages this credential can see in the scope"
          if ! npm access list packages 2>&1; then
            echo "  REFUSED on the org endpoint. An anonymous reader is not refused here, so this"
            echo "  is about the credential's kind, not about the scope being unreachable."
          fi

          # The discriminator, and the reason the two probes above are not
          # enough. A classic automation token can read this endpoint and a
          # granular one cannot. A classic token carries its owner's publish
          # rights, so with a read-write grant below the publish is as proven
          # as it gets without publishing. A granular token's package grants
          # are fixed when it is created and are not readable from here at all,
          # which is the residual risk this gate cannot close.
          echo "== the kind of credential"
          if npm token list >/dev/null 2>&1; then
            echo "  classic automation token: it carries the owner's publish rights."
          else
            echo "  granular access token: its package grants are fixed at creation and cannot be"
            echo "  read from here. If this package is not among them the publish fails with E404"
            echo "  and no change in this repository can fix it. Check the token at npmjs.com."
          fi

          # FATAL ONLY ON A DEFINITE NEGATIVE. Note what this is and is not:
          # the collaborators endpoint is a PUBLIC read, so it reports the npm
          # USER's grant on the package and not the token's. A read-only grant
          # therefore means the publish cannot succeed whatever the token is,
          # which is worth stopping for; read-write does not prove the token
          # inherits it, which is why it is not reported as a pass.
          echo "== the account's grant on the package"
          if grants="$(npm access list collaborators "${pkg}" --json 2>/dev/null)"; then
            mine="$(printf '%s' "${grants}" | jq -r --arg u "${who}" '.[$u] // "not listed"')"
            echo "  ${who}: ${mine}"
            if [ "${mine}" = "read-only" ]; then
              echo "::error::${who} holds read-only access to ${pkg}, so the publish cannot succeed."
              echo "::error::grant write access or rotate NPM_TOKEN before releasing."
              exit 1
            fi
          else
            echo "  the endpoint did not answer, which does not distinguish 'no permission' from"
            echo "  'no such package', so it is not treated as a verdict."
          fi

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - npm-credential
      - tag
      - release-checks
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without
      # push access, so the gate below would report "no release" for a draft
      # that is sitting right there. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      # The notes are not the workflow's to write. A CHANGELOG entry is one or
      # two lines for a contributor, which makes poor release notes for someone
      # deciding whether to upgrade, so a human writes the draft first.
      #
      # Listed rather than addressed by tag: a draft's tag is not a git ref, so
      # `gh release view <tag>` can match nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The release tag is on main
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG is not on the main line"; exit 1; }

      - name: The version surfaces agree
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            [ "$version" = "$RELEASE_TAG" ] \
              || { echo "::error::package.json is $version, tag is $RELEASE_TAG"; exit 1; }
          fi
          grep -qE "^## \[?${version//./\\.}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # A git dependency in runtime `dependencies` ships to every consumer, who
      # then needs git and GitHub reachability and has no registry tarball to
      # check an integrity hash against.
      - name: No dependency is installed over git
        run: |
          node -e '
            const deps = require("./package.json").dependencies ?? {};
            const git = Object.entries(deps).filter(([, r]) => /^(git|github:|[^@/]+\/[^@/]+$)/.test(r));
            if (git.length) {
              console.log(`::error::git dependency: ${git.map(([n, r]) => `${n}@${r}`).join(", ")}`);
              process.exit(1);
            }
          '

      - name: The npm credential authenticates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] \
            || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          code="$(curl -sS -o /tmp/npm-who.json -w '%{http_code}' \
            -H "Authorization: Bearer $NPM_TOKEN" \
            https://registry.npmjs.org/-/whoami)"
          [ "$code" = 200 ] \
            || { echo "::error::NPM_TOKEN does not authenticate (HTTP $code)"; exit 1; }

      - run: npm ci
      - run: npm run check
      - run: npm test

      # The package is useless without the templates and resources it loads at
      # run time, and `files` is easy to narrow by accident.
      - name: The package carries its templates and resources
        run: |
          tarball="$(npm pack --silent)"
          listing="$(tar -tzf "$tarball")"
          for path in package/dist/cli.js package/templates package/resources; do
            printf '%s\n' "$listing" | grep -q "^$path" \
              || { echo "::error::$tarball is missing $path"; exit 1; }
          done

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$RELEASE_VERSION" ]; then
            npm publish --dry-run --access public
            echo "::notice::rehearsal - nothing was published"
          else
            npm publish --access public
          fi

      # Publish the draft a human wrote. Addressed by ID with tag_name sent,
      # because omitting tag_name on a draft clears the tag to `untagged-...`.
      - name: Publish the release notes written for this tag
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first | .id // empty")"
          [ -n "$id" ] || { echo "::error::the release for $RELEASE_TAG vanished"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$RELEASE_TAG" -F draft=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq 'if .draft then error("release is still a draft") else "published \(.tag_name)" end'
    if: ${{ !cancelled() && !failure() && needs['release-checks'].result == 'success' && (needs.tag.result == 'success'
      || (github.event_name == 'workflow_dispatch' && inputs.version == '')) }}
  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - npm-credential
      - release-checks
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the tag unless it already exists
        run: |
          set -euo pipefail
          candidate="${RELEASE_TAG#v}"
          [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          version="$(node -p 'require("./package.json").version')"
          [ "$version" = "$candidate" ] || { echo "::error::Package version $version differs from $RELEASE_TAG"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
            [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::Existing tag points to another commit"; exit 1; }
            echo "$RELEASE_TAG is already on the remote; creating nothing."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::this run is on tag $RELEASE_TAG, which is not on the remote."
            exit 1
          fi
          # Re-checked under the approval: a tag can appear while a run waits.
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG at $GITHUB_SHA"
    if: github.ref_type == 'tag' || inputs.version != ''
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - npm-credential
    permissions:
      # `write`, not `read`: a DRAFT release is invisible to a caller without
      # push access, so the gate below would report "no release" for a draft
      # that is sitting right there. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      # The notes are not the workflow's to write. A CHANGELOG entry is one or
      # two lines for a contributor, which makes poor release notes for someone
      # deciding whether to upgrade, so a human writes the draft first.
      #
      # Listed rather than addressed by tag: a draft's tag is not a git ref, so
      # `gh release view <tag>` can match nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The release tag is on main
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$RELEASE_TAG is not on the main line"; exit 1; }

      - name: The version surfaces agree
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            [ "$version" = "$RELEASE_TAG" ] \
              || { echo "::error::package.json is $version, tag is $RELEASE_TAG"; exit 1; }
          fi
          grep -qE "^## \[?${version//./\\.}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # A git dependency in runtime `dependencies` ships to every consumer, who
      # then needs git and GitHub reachability and has no registry tarball to
      # check an integrity hash against.
      - name: No dependency is installed over git
        run: |
          node -e '
            const deps = require("./package.json").dependencies ?? {};
            const git = Object.entries(deps).filter(([, r]) => /^(git|github:|[^@/]+\/[^@/]+$)/.test(r));
            if (git.length) {
              console.log(`::error::git dependency: ${git.map(([n, r]) => `${n}@${r}`).join(", ")}`);
              process.exit(1);
            }
          '

      - name: The npm credential authenticates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] \
            || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          code="$(curl -sS -o /tmp/npm-who.json -w '%{http_code}' \
            -H "Authorization: Bearer $NPM_TOKEN" \
            https://registry.npmjs.org/-/whoami)"
          [ "$code" = 200 ] \
            || { echo "::error::NPM_TOKEN does not authenticate (HTTP $code)"; exit 1; }

      - run: npm ci
      - run: npm run check
      - run: npm test

      # The package is useless without the templates and resources it loads at
      # run time, and `files` is easy to narrow by accident.
      - name: The package carries its templates and resources
        run: |
          tarball="$(npm pack --silent)"
          listing="$(tar -tzf "$tarball")"
          for path in package/dist/cli.js package/templates package/resources; do
            printf '%s\n' "$listing" | grep -q "^$path" \
              || { echo "::error::$tarball is missing $path"; exit 1; }
          done

    name: Verify release before approval
env:
  RELEASE_TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}
  RELEASE_VERSION: ${{ inputs.version }}
