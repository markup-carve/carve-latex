name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
  # `npm ci` installs the lockfile, so the jobs above only ever see one point in
  # the `^0.1.7` range the manifest declares - and a consumer installing today
  # gets whatever the range resolves to. This job is the only one that renders
  # against that. It is a gate, not an advisory: an engine release this repo
  # cannot render against is this repo's problem before it is a user's.
  resolved-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node -p "'engine ' + require('@markup-carve/carve/package.json').version"
      - run: npm run check
      - run: npm test

  latex-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended biber poppler-utils
      - run: node dist/cli.js examples/paper.crv --pdf --output examples/paper.pdf --source-date-epoch 0 --quality-gate
      - run: test -s examples/paper.pdf
      # An emitted \autocite that Biber never resolves is the same defect as
      # no cite at all, so the gate reads the bibliography out of the PDF
      # rather than out of the generated TeX. The text is flattened to one
      # line first, because pdftotext wraps at the column the PDF wraps at and
      # every string checked here is longer than a line is wide.
      - name: The compiled PDF carries the rulings
        run: |
          pdftotext -nopgbrk examples/paper.pdf - | tr '\n' ' ' | tr -s ' ' > examples/paper.txt
          need() {
            grep -qF "$1" examples/paper.txt \
              || { echo "::error::missing from the PDF: $1"; exit 1; }
            echo "  found: $1"
          }
          refuse() {
            if grep -qF "$1" examples/paper.txt; then
              echo "::error::still in the PDF: $1"; exit 1
            fi
            echo "  absent: $1"
          }
          need 'Markup Carve contributors'
          need 'Table 1: Fidelity of the translated constructs'
          refuse 'Table : Fidelity'
          need 'Warning'
          need 'On the fidelity report'
      - run: node dist/cli.js --project examples/book.carve-latex.yml --output examples/book.tex --sarif examples/book.sarif
      - run: test -s examples/book.tex && test -s examples/book.sarif
      - run: node dist/cli.js --project examples/book.carve-latex.yml --pdf --preset book --output examples/book.pdf --quality-gate
      - run: test -s examples/book.pdf
      # Each notice kind has its own environment, and a preset template that
      # does not declare one produces TeX that will not compile.
      - run: |
          for preset in article book thesis journal technical-report; do
            node dist/cli.js examples/paper.crv --pdf --preset "$preset" \
              --output "examples/preset-$preset.pdf" --source-date-epoch 0
            test -s "examples/preset-$preset.pdf"
          done
